<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Professor Life Sim — Prototype</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d0d1a; overflow: hidden; font-family: monospace; color: #ccc; }
        canvas { display: block; position: fixed; top: 0; left: 0; }
        #controls {
            position: fixed;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #555;
            background: rgba(13,13,26,0.75);
            padding: 4px 12px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
        }
        #controls label { pointer-events: all; cursor: pointer; margin-right: 12px; color: #666; }

        #character-creator {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d0d1a;
            z-index: 100;
        }
        #character-creator h1 {
            font-size: 13px;
            letter-spacing: 0.2em;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 48px;
        }
        #character-creator label {
            font-size: 11px;
            color: #555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        #character-creator input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #ccc;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
            width: 280px;
            padding: 6px 0;
            outline: none;
        }
        #character-creator input:focus { border-bottom-color: #666; }
        #character-creator button {
            margin-top: 40px;
            background: transparent;
            border: 1px solid #333;
            color: #555;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 8px 28px;
            cursor: pointer;
        }
        #character-creator button:hover { border-color: #666; color: #888; }
    </style>

    <!-- Utilities -->
    <script src="util.js"></script>
    <script src="timer.js"></script>
    <script src="assetmanager.js"></script>

    <!-- Components -->
    <script src="components/position.js"></script>
    <script src="components/velocity.js"></script>
    <script src="components/sprite.js"></script>
    <script src="components/animator.js"></script>
    <script src="components/collider.js"></script>
    <script src="components/facing.js"></script>
    <script src="components/text.js"></script>
    <script src="components/playercontrolled.js"></script>
    <script src="components/agent.js"></script>
    <script src="components/inventory.js"></script>
    <script src="components/skills.js"></script>
    <script src="components/schedule.js"></script>
    <script src="components/npc.js"></script>
    <script src="components/task.js"></script>
    <script src="components/project.js"></script>
    <script src="components/commitment.js"></script>
    <script src="components/quarter.js"></script>
    <script src="components/critter.js"></script>

    <!-- Systems -->
    <script src="systems/pathfinding.js"></script>
    <script src="systems/clock.js"></script>
    <script src="systems/season.js"></script>
    <script src="systems/schedule.js"></script>
    <script src="systems/playerinput.js"></script>
    <script src="systems/npc.js"></script>
    <script src="systems/taskinteraction.js"></script>
    <script src="systems/npcdialogue.js"></script>
    <script src="systems/registration.js"></script>
    <script src="systems/shop.js"></script>
    <script src="systems/calendar.js"></script>
    <script src="systems/movement.js"></script>
    <script src="systems/critters.js"></script>
    <script src="systems/camera.js"></script>
    <script src="systems/animation.js"></script>
    <script src="systems/lighting.js"></script>
    <script src="systems/rain.js"></script>
    <script src="systems/wisps.js"></script>
    <script src="systems/render.js"></script>
    <script src="systems/projectui.js"></script>
    <script src="systems/ui.js"></script>
    <script src="systems/sleep.js"></script>
    <script src="systems/scene.js"></script>

    <!-- Maps -->
    <script src="maps/campus.js"></script>
    <script src="maps/tilesets.js"></script>
    <script src="maps/autotile.js"></script>
    <script src="maps/buildingkit.js"></script>

    <!-- Entity Factories -->
    <script src="entities/charactersheets.js"></script>
    <script src="entities/props.js"></script>
    <script src="entities/student.js"></script>
    <script src="entities/projects.js"></script>
    <script src="entities/courses.js"></script>

    <!-- Core Engine + Entry Point (last) -->
    <script src="setup.js"></script>
    <script src="gameengine.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <canvas id="gameWorld" tabindex="0"></canvas>

    <div id="character-creator">
        <h1>Professor Life Sim</h1>
        <label for="playerName">Your name</label>
        <input id="playerName" type="text" maxlength="32" autocomplete="off" spellcheck="false">
        <button id="startBtn">Begin</button>
    </div>

    <div id="controls">
        <label><input type="checkbox" id="debugMode"> Debug</label>
        WASD / Arrows — move &nbsp;|&nbsp;
        E (hold) — active tasks &nbsp;|&nbsp;
        E (tap) — start triggered / sleep &nbsp;|&nbsp;
        Tab / 1–9 — cycle station tasks &nbsp;|&nbsp;
        C — character sheet &nbsp;|&nbsp;
        I — inventory &nbsp;|&nbsp;
        F — calendar
    </div>
</body>
</html>
